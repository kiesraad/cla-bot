name: Rebuild dist

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  rebuild-dist:
    name: Rebuild dist
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # https://github.com/actions/checkout/blob/v7.0.1/README.md#push-a-commit-to-a-pr-using-the-built-in-token
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm
        run: >
          npm install --global corepack@latest &&
          corepack enable &&
          corepack prepare pnpm@latest-11 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit and push dist if changed
        run: |
          if git diff --quiet dist/; then
            echo "dist/ unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Rebuild dist"
          git push
